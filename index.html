<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mera card</title>
    <style>
        *{
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }

        body{
            background-color: rgb(250, 250, 2);
            width: 100vw;
            height: 100vh;
            display: grid;
            place-content: center;

        }
        div{
            background-color: black;
            width: 400px;    
            border-radius: 20px;
            text-align: center;
            overflow: hidden;
        }

        image{
            width: 400px;
            height: 350px
            object-fit: cover;
        }

        a{
            font-size: 40px;
            background-color: yellow;
            display: block;
            margin: 10px;
            padding: 10px;
            border-radius: 20px;
            text-decoration: none;

        }
    </style>
</head>
<body>
    <div>
        <img src="pic.jpg" alt="mahi sir">

        <a href="https://instagram.com/mahi7781"> @mahi7781 </a>
    </div>
    
</body>
</html>
